version: '3.8'

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myappdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
  
  migrations:
    build:
      context: .
      dockerfile: ./Infrastructure/Dockerfile.migrations
    command: ["database", "update"]
    environment:
      - ConnectionString=Host=db;Database=myappdb;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
  
  
  app:
    build:
      context: .
      dockerfile: ./Infrastructure/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/Drug || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - default
      - shared_services_default    

networks:
  shared_services_default:
    external: true